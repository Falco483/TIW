<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risultato / Dettaglio — Configuratore di Prodotto</title>
</head>
<body>

<header>
    <div th:replace="~{fragments/navbar :: navBar(@{/fornitore/home})}"></div>
    <h1>Dettaglio Elemento</h1>
</header>

<section th:if="${risultato != null}">
    <h2>Elemento creato/visualizzato con successo</h2>
    <div th:replace="~{fornitore/risultato :: dettaglioOggetto(risultato=${risultato}, tipoRisultato=${tipoRisultato}, nascondiAzioni=true)}"></div>
</section>

<div th:remove="all">
<!-- FRAGMENT PRINCIPALE -->
<div th:fragment="dettaglioOggetto(risultato, tipoRisultato, nascondiAzioni)" th:switch="${tipoRisultato}">

    <!-- SKU creata/cercata -->
    <div th:case="'sku'">
        <h3>SKU</h3>
        <table>
            <tr><th>Codice</th>      <td th:text="${risultato.codice}"></td></tr>
            <tr><th>Nome</th>        <td th:text="${risultato.nome}"></td></tr>
            <tr><th>Fotografia</th>
                <td>
                    <div th:if="${risultato.fotografia != null}">
                        <img th:src="${risultato.fotografia}" alt="Foto SKU" style="max-width: 250px; height: auto;" />
                    </div>
                </td>
            </tr>
            <tr><th>Descrizione tecnica</th><td th:text="${risultato.descrizioneTecnica}"></td></tr>
            <tr><th>Prezzo</th>      <td th:text="${risultato.prezzo} + ' €'"></td></tr>
        </table>
        <form method="post" th:action="@{/fornitore/azione}" style="margin-top: 15px;" th:if="${!nascondiAzioni}"
              onsubmit="return confirm('Attenzione: l\'eliminazione cancellerà anche tutte le configurazioni dei clienti collegate. Procedere?');">
            <input type="hidden" name="_csrf" th:value="${session.csrfToken}">
            <input type="hidden" name="azione" value="ELIMINA">
            <input type="hidden" name="tipoOggetto" value="SKU">
            <input type="hidden" name="idOggetto" th:value="${risultato.id}">
            <button type="submit" style="background-color: red; color: white; border: none; padding: 5px 10px; cursor: pointer;">ELIMINA SKU</button>
        </form>
    </div>

    <!-- Prodotto semplice creato/cercato -->
    <div th:case="'semplice'">
        <h3>Prodotto Semplice: <span th:text="${risultato.nome}"></span></h3>
        <p>Codice: <span th:text="${risultato.codice}"></span></p>

        <form method="post" th:action="@{/fornitore/azione}" style="margin-bottom: 15px;" th:if="${!nascondiAzioni}"
              onsubmit="return confirm('Attenzione: l\'eliminazione cancellerà anche tutte le configurazioni dei clienti collegate. Procedere?');">
            <input type="hidden" name="_csrf" th:value="${session.csrfToken}">
            <input type="hidden" name="azione" value="ELIMINA">
            <input type="hidden" name="tipoOggetto" value="SEMPLICE">
            <input type="hidden" name="idOggetto" th:value="${risultato.id}">
            <button type="submit" style="background-color: red; color: white; border: none; padding: 5px 10px; cursor: pointer;">ELIMINA PRODOTTO</button>
        </form>

        <h4>SKU associate</h4>
        <ul>
            <li th:each="sku : ${risultato.skus}" style="margin-bottom: 5px;">
                <span th:text="${sku.codice} + ' — ' + ${sku.nome} + ' (' + ${sku.prezzo} + ' €)'"></span>
                <form method="post" th:action="@{/fornitore/azione}" style="display: inline-block; margin-left: 10px;" th:if="${!nascondiAzioni}">
                    <input type="hidden" name="_csrf" th:value="${session.csrfToken}">
                    <input type="hidden" name="azione" value="RIMUOVI">
                    <input type="hidden" name="tipoOggetto" value="SKU">
                    <input type="hidden" name="idOggetto" th:value="${sku.id}">
                    <input type="hidden" name="idPadre" th:value="${risultato.id}">
                    <button type="submit" style="background-color: #ff9800; color: white; border: none; padding: 2px 6px; cursor: pointer;" onclick="return confirm('Sicuro di voler SCOLLEGARE questa SKU dal prodotto?');">Rimuovi</button>
                </form>
            </li>
        </ul>
    </div>

    <!-- Prodotto composto creato/cercato -->
    <div th:case="'composto'">
        <h3>Prodotto Composto: <span th:text="${risultato.nome}"></span></h3>
        <p>Codice: <span th:text="${risultato.codice}"></span></p>
        <p>Descrizione: <span th:text="${risultato.descrizione}"></span></p>
        <p>Fascia di prezzo: <span th:text="${risultato.prezzoMin}"></span> € — <span th:text="${risultato.prezzoMax}"></span> €</p>

        <form method="post" th:action="@{/fornitore/azione}" style="margin-bottom: 15px;" th:if="${!nascondiAzioni}"
              onsubmit="return confirm('Attenzione: l\'eliminazione cancellerà anche tutte le configurazioni dei clienti collegate. Procedere?');">
            <input type="hidden" name="_csrf" th:value="${session.csrfToken}">
            <input type="hidden" name="azione" value="ELIMINA">
            <input type="hidden" name="tipoOggetto" value="COMPOSTO">
            <input type="hidden" name="idOggetto" th:value="${risultato.id}">
            <button type="submit" style="background-color: red; color: white; border: none; padding: 5px 10px; cursor: pointer;">ELIMINA PRODOTTO</button>
        </form>

        <h4>Componenti</h4>
        <ul>
            <!-- Visualizzazione dell'albero con il tasto Rimuovi per i figli diretti -->
            <th:block th:each="figlio : ${risultato.figli}">
                <li style="margin-bottom: 5px;">
                    <strong th:text="${figlio.nome}"></strong>
                    <form method="post" th:action="@{/fornitore/azione}" style="display: inline-block; margin-left: 10px;" th:if="${!nascondiAzioni}">
                        <input type="hidden" name="_csrf" th:value="${session.csrfToken}">
                        <input type="hidden" name="azione" value="RIMUOVI">
                        <input type="hidden" name="tipoOggetto" th:value="${figlio.tipo}">
                        <input type="hidden" name="idOggetto" th:value="${figlio.id}">
                        <input type="hidden" name="idPadre" th:value="${risultato.id}">
                        <button type="submit" style="background-color: #ff9800; color: white; border: none; padding: 2px 6px; cursor: pointer;" onclick="return confirm('Sicuro di voler SCOLLEGARE questo componente dal prodotto?');">Rimuovi</button>
                    </form>
                    
                    <ul th:if="${figlio.tipo == 'SEMPLICE' and figlio.skus != null and !figlio.skus.isEmpty()}">
                        <li th:each="sku : ${figlio.skus}" th:text="${sku.codice} + ' — ' + ${sku.nome} + ' (' + ${sku.prezzo} + ' €)'"></li>
                    </ul>
                    <ul th:if="${figlio.tipo == 'COMPOSTO' and figlio.figli != null and !figlio.figli.isEmpty()}">
                        <th:block th:each="subfiglio : ${figlio.figli}">
                            <th:block th:replace="~{fornitore/risultato :: albero(${subfiglio})}"></th:block>
                        </th:block>
                    </ul>
                </li>
            </th:block>
        </ul>
    </div>
</div>
</div>

<!-- Fragment ricorsivo per l'albero prodotto composto, per non duplicare il codice Rimuovi a profondità > 1 -->
<th:block th:fragment="albero(nodo)" th:if="${nodo != null}">
    <li th:if="${nodo.tipo == 'SEMPLICE'}">
        <strong th:text="${nodo.nome}"></strong>
        <ul th:if="${nodo.skus != null and !nodo.skus.isEmpty()}">
            <li th:each="sku : ${nodo.skus}"
                th:text="${sku.codice} + ' — ' + ${sku.nome} + ' (' + ${sku.prezzo} + ' €)'"></li>
        </ul>
    </li>
    <li th:if="${nodo.tipo == 'COMPOSTO'}">
        <strong th:text="${nodo.nome}"></strong>
        <ul th:if="${nodo.figli != null and !nodo.figli.isEmpty()}">
            <th:block th:each="figlio : ${nodo.figli}">
                <th:block th:replace="~{fornitore/risultato :: albero(${figlio})}"></th:block>
            </th:block>
        </ul>
    </li>
</th:block>

</body>
</html>
