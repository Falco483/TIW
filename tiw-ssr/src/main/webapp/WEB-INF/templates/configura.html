<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${idConfig != null ? 'Modifica Configurazione' : 'Configura Prodotto'}">Configura Prodotto
    </title>
</head>

<body>
    <header>
        <a th:href="@{/cliente/home}"
            style="display: inline-block; padding: 8px 16px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; margin-bottom: 10px;">HOME</a>
    </header>
    <h2 th:text="${idConfig != null ? 'Modifica: ' : 'Configura: '} + ${radice.nome}"></h2>

    <form method="POST" th:action="@{/cliente/configura}">
        <input type="hidden" name="_csrf" th:value="${session.csrfToken}" />
        <input type="hidden" name="codiceRadice" th:value="${radice.codice}" />
        <input type="hidden" name="idConfig" th:value="${idConfig}" />
        <input th:each="id : ${apertoSet}" type="hidden" name="aperto" th:value="${id}" />

        <!--
            Hidden fields per le scelte SKU di prodotti NON visibili nel form corrente
            (nodi non espansi). Così le scelte sopravvivono a espansioni successive
            senza bisogno di sessione.
        -->
        <th:block th:if="${mappaScelte != null}">
            <th:block th:each="entry : ${mappaScelte.entrySet()}">
                <input th:if="${!prodottiVisibili.contains(entry.key)}"
                       type="hidden"
                       th:name="'sku_' + ${entry.key}"
                       th:value="${entry.value}" />
            </th:block>
        </th:block>

        <div th:if="${errore != null}" th:text="${errore}" style="color:red; margin-bottom: 10px;"></div>

        <label for="nomeConfigurazione">Nome Configurazione:</label>
        <input type="text" id="nomeConfigurazione" name="nomeConfigurazione" required
            th:value="${nomeInserito != null ? nomeInserito : nomeConfigurazione}" />
        <br /><br />

        <h3>Seleziona Componenti</h3>
        <ul>
            <li th:replace="~{::albero(${radice}, true)}"></li>
        </ul>

        <button type="submit"
            th:text="${idConfig != null ? 'Aggiorna Configurazione' : 'Salva Configurazione'}">Salva
            Configurazione</button>
    </form>

    <th:block th:fragment="albero(nodo, isRadice)" th:if="${nodo != null}">
        <span th:text="${nodo.nome}"></span>

        <th:block th:if="${nodo.tipo == 'SEMPLICE'}">
            <select th:name="'sku_' + ${nodo.id}" required>
                <option value="" disabled th:selected="${mappaScelte == null || mappaScelte.get(nodo.id) == null}">
                    Scegli un'opzione...</option>
                <option th:each="sku : ${nodo.skus}" th:value="${sku.id}"
                    th:text="${sku.nome + ' - ' + sku.prezzo + ' €'}"
                    th:selected="${mappaScelte != null && mappaScelte.get(nodo.id) == sku.id}">
                </option>
            </select>
        </th:block>

        <th:block th:if="${nodo.tipo == 'COMPOSTO'}">
            <th:block th:if="${isRadice || apertoSet.contains(nodo.codice)}">
                <ul>
                    <li th:each="figlio : ${nodo.figli}">
                        <th:block th:replace="~{::albero(${figlio}, false)}"></th:block>
                    </li>
                </ul>
            </th:block>
            <th:block th:unless="${isRadice || apertoSet.contains(nodo.codice)}">
                <button type="submit" name="espandi" th:value="${nodo.codice}" formnovalidate>Espandi ▶</button>
            </th:block>
        </th:block>
    </th:block>

</body>

</html>
