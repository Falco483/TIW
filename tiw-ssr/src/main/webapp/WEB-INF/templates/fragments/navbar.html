<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header class="top-navbar" th:fragment="navBar(homeUrl)">
    <div class="top-navbar-content" style="display:flex; justify-content:space-between; align-items:center;">
        
        <!-- Sinistra: Logout -->
        <div class="top-navbar-left">
            <form th:action="@{/logout}" method="post" style="display:inline; margin: 0;">
                <input type="hidden" name="_csrf" th:value="${session.csrfToken}"/>
                <button type="submit" class="btn btn-danger">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
                </button>
            </form>
        </div>

        <!-- Centro: Benvenuto -->
        <div style="text-align: center; flex: 1;">
            <h2 style="margin: 0; font-size: 1.25rem;">Ciao <span th:text="${session.utente != null ? (session.utente.nome + ' ' + session.utente.cognome) : 'Ospite'}">Nome Cognome</span></h2>
        </div>

        <!-- Destra: Navigazione (Home, Ricerca, Mie Conf) -->
        <div class="top-navbar-right" style="display: flex; gap: 0.5rem;">
            
            <!-- Tasto Home -->
            <th:block th:if="${session.utente != null and session.utente.ruolo.name() == 'FORNITORE'}">
                <a th:href="@{/fornitore/home}" class="btn btn-primary" style="text-decoration: none;">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a th:href="@{/fornitore/cerca}" class="btn btn-ghost" style="text-decoration: none;">
                    <i class="fa-solid fa-magnifying-glass"></i> Cerca
                </a>
            </th:block>

            <th:block th:if="${session.utente != null and session.utente.ruolo.name() == 'CLIENTE'}">
                <a th:href="@{/cliente/home}" class="btn btn-primary" style="text-decoration: none;">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a th:href="@{/cliente/configurazioni}" class="btn btn-ghost" style="text-decoration: none;">
                    <i class="fa-solid fa-list-check"></i> Le mie Configurazioni
                </a>
            </th:block>

        </div>
    </div>
</header>

<script>
    function showCustomConfirm(formOrButton, event, message) {
        event.preventDefault();
        
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s;';
        
        const modal = document.createElement('div');
        modal.style.cssText = 'background: var(--card-bg); padding: 1.5rem; border-radius: var(--radius-md); box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-width: 400px; width: 90%; transform: translateY(-20px); transition: transform 0.2s;';
        
        modal.innerHTML = `
            <div style="display: flex; align-items: center; margin-bottom: 1rem; color: var(--text-primary); font-weight: 600;">
                <i class="fa-solid fa-circle-exclamation" style="color: var(--warning); margin-right: 0.5rem; font-size: 1.25rem;"></i>
                Conferma operazione
            </div>
            <p style="margin-bottom: 1.5rem; color: var(--text-secondary); font-size: 0.95rem;">${message}</p>
            <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
                <button type="button" class="btn btn-ghost" id="btn-modal-annulla">Annulla</button>
                <button type="button" class="btn btn-primary" id="btn-modal-conferma" style="background: var(--warning); border-color: var(--warning);">Conferma</button>
            </div>
        `;
        
        overlay.appendChild(modal);
        document.body.appendChild(overlay);
        
        requestAnimationFrame(() => {
            overlay.style.opacity = '1';
            modal.style.transform = 'translateY(0)';
        });
        
        const close = (result) => {
            overlay.style.opacity = '0';
            modal.style.transform = 'translateY(-20px)';
            setTimeout(() => overlay.remove(), 200);
            
            if (result) {
                if (formOrButton.tagName === 'FORM') {
                    formOrButton.submit();
                } else {
                    // Se era un button onclick che faceva submit
                    const form = formOrButton.closest('form');
                    if (form) form.submit();
                }
            }
        };
        
        modal.querySelector('#btn-modal-annulla').addEventListener('click', () => close(false));
        modal.querySelector('#btn-modal-conferma').addEventListener('click', () => close(true));
        
        return false;
    }
</script>


</body>
</html>
