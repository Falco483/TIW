<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="navBar(homeUrl)">
    <a th:if="${homeUrl != null}" th:href="${homeUrl}"
       style="display: inline-block; padding: 8px 16px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; margin-bottom: 10px;">HOME</a>
    <form th:action="@{/logout}" method="post" style="display:inline">
        <input type="hidden" name="_csrf" th:value="${session.csrfToken}"/>
        <button type="submit">Logout</button>
    </form>
</div>

</body>
</html>
